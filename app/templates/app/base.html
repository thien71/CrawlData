{% load static %}

<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]>      <html class="no-js"> <!--<![endif]-->
<html>
  <head>
      <meta charset="utf-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <title>Điện máy chợ nhỏ</title>
      <meta name="description" content="">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
      <link rel="stylesheet" href="{% static 'app/css/style.css' %}">
      <link rel="stylesheet" href="{%static 'app/css/all.min.css' %}">
      <link rel="stylesheet" href="{%static 'app/css/owl.carousel.min.css' %}">
      
      <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
      <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
      <script src="{%static 'app/js/owl.carousel.min.js' %}"></script>
      <script src="{%static 'app/js/script.js' %}"></script>
      <script src="{%static 'app/js/all.min.js' %}"></script>
      
      <script src="https://kit.fontawesome.com/4e5999a8c6.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <header class="header">
      <nav class="container navbar navbar-expand-lg">
        <div class="container-fluid row justify-content-center align-content-center">
          <!-- Logo -->
          <a class="navbar-brand col-2" href="#">
            <img src="https://cdn11.dienmaycholon.vn/filewebdmclnew/DMCL21/FE/images/logo.png" alt="Your Logo" width="120">
          </a>
          
          <!-- Toggle button for smaller screens -->
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          
          <!-- Search form -->
          <form action="" class="d-flex mx-auto col-8 search" method="get" id="myForm">
            {% comment %} {% csrf_token %} {% endcomment %}
            <input class="form-control" id="searchInput" name="searchInput" type="search" placeholder="Search" value="{{ searchInput }}">
            <button class="btn" type="submit">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </form>
          
          <!-- Giỏ hàng và Hotline -->
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 col-2 row cart">
            <li class="nav-item col-6">
              <a class="nav-link" href="#">
                {% comment %} <i class="fa-solid fa-cart-shopping"></i> {% endcomment %}
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    
    <main>
    {% block main-content%}<h1></h1> {% endblock main-content%}
    </main>

    <footer d-lex bg-black text-align-center>copyright 2024</footer>
  </body>
</html>
